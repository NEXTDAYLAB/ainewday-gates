name: gate-chain-selftest
# Tự kiểm của chuỗi gate-chain trên MỌI PR (không lọc paths — job tổng làm check bắt buộc được, CI.md luật 1):
#   test-gates — mỗi cổng dùng chung đỏ trên fixture vi phạm, xanh trên fixture sạch, BROKEN khi thiếu công cụ (scripts/gates/test-gates.sh)
#   dogfood    — kho này tự chạy đúng workflow gate-chain.yml mà repo dự án sẽ gọi, với bộ cổng của chính commit này
#   gate-chain-selftest — job tổng (if: always()), tên cố định để đặt required check trong ruleset bảo vệ main
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-chain-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  test-gates:
    name: test-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
      - name: Cài gitleaks ${{ env.GITLEAKS_VERSION }} (kiểm SHA-256)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Ca kiểm âm + ca xanh + ca BROKEN của mọi cổng
        run: bash scripts/gates/test-gates.sh

  dogfood:
    uses: ./.github/workflows/gate-chain.yml
    with:
      gates-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      gate-dir: scripts/gates
      runners: scripts/gates/run-all.sh
      skip: pitfall-has-gate

  gate-chain-selftest:
    name: gate-chain-selftest
    if: always()
    needs: [test-gates, dogfood]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tổng hợp (skipped là đạt; failure/cancelled là đỏ)
        env:
          R_TEST: ${{ needs.test-gates.result }}
          R_DOGFOOD: ${{ needs.dogfood.result }}
        run: |
          echo "test-gates: $R_TEST · dogfood: $R_DOGFOOD"
          for r in "$R_TEST" "$R_DOGFOOD"; do
            case "$r" in success|skipped) ;; *) echo "::error::có job $r"; exit 1 ;; esac
          done
