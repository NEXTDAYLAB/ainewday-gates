# Cấu hình gitleaks CẤP CÔNG TY — dùng bởi cổng secret-scan của chuỗi gate-chain (LUAT §5 L2, BH-011, BH-037).
# Bộ luật mặc định của gitleaks + luật cho cách người Việt ghi bí mật.
# Khái quát từ một dự án nội bộ .gitleaks.toml (luật mặc định của gitleaks bỏ lọt mật khẩu ghi theo kiểu tiếng Việt).
# Repo dự án có .gitleaks.toml riêng ⇒ cổng chạy THÊM một lượt với cấu hình đó (không thay cấu hình này).
# Báo nhầm ở một repo ⇒ thêm vân tay (fingerprint) vào .gitleaksignore ở gốc repo đó, kèm lý do trong PR.
title = "ainewday-company"

[extend]
useDefault = true

# Luật 1 — mật khẩu trong dấu nháy ngược cạnh nhãn (cả dạng bảng): "| **Mật khẩu sudo** | `Abc...` |", "password `...`".
[[rules]]
id = "vi-password-backtick"
description = "Mật khẩu trong dấu nháy ngược cạnh nhãn tiếng Việt/Anh"
regex = '''(?i)(mật\s?khẩu|mat\s?khau|matkhau|mat_khau|\bpassword\b|\bpasswd\b|\bpass\b|khoá\s?bí\s?mật|khoa\s?bi\s?mat)[^`\n]{0,25}`([A-Za-z0-9!@#$%^&*_+=.\-]{8,})`'''
secretGroup = 2
entropy = 2.5
keywords = ["mật khẩu", "mat khau", "matkhau", "mat_khau", "pass", "khoá bí mật", "khoa bi mat"]
# Chỉ quét TÀI LIỆU + cấu hình chữ (anh Châu quyết 31/10/2026, chat, phương án 1a): trong MÃ NGUỒN mẫu "token: x" / "password: x"
# là tên biến, khoá quyền, nhãn giao diện. Đo 31/10 trên 5 repo: vi-key-colon 738/1047 phát hiện, gần như toàn báo nhầm trong .ts/.rs/.mjs.
# Bí mật trong mã nguồn do luật mặc định của gitleaks bắt (generic-api-key, curl-auth-…).
path = '''(?i)(\.(md|markdown|mdx|txt|ya?ml|toml|ini|cfg|conf|properties|adoc|rst)$|(^|/)[^/.]+$)'''

# Luật 2 — mật khẩu sau dấu ":" hoặc "=" (trần hoặc trong nháy ngược): "matkhau: Abc-123-...", "pass = ...".
[[rules]]
id = "vi-password-colon"
description = "Mật khẩu sau nhãn tiếng Việt/Anh và dấu : hoặc ="
regex = '''(?i)(mật\s?khẩu|mat\s?khau|matkhau|mat_khau|\bpassword\b|\bpasswd\b|\bpass\b)[^:=\n`|.;,]{0,20}[:=]\s*[*]{0,2}\s*`?([A-Za-z0-9!@#$%^&*_+=.\-]{8,})'''
secretGroup = 2
entropy = 3.0
keywords = ["mật khẩu", "mat khau", "matkhau", "mat_khau", "pass"]
# Chỉ quét TÀI LIỆU + cấu hình chữ (anh Châu quyết 31/10/2026, chat, phương án 1a): trong MÃ NGUỒN mẫu "token: x" / "password: x"
# là tên biến, khoá quyền, nhãn giao diện. Đo 31/10 trên 5 repo: vi-key-colon 738/1047 phát hiện, gần như toàn báo nhầm trong .ts/.rs/.mjs.
# Bí mật trong mã nguồn do luật mặc định của gitleaks bắt (generic-api-key, curl-auth-…).
path = '''(?i)(\.(md|markdown|mdx|txt|ya?ml|toml|ini|cfg|conf|properties|adoc|rst)$|(^|/)[^/.]+$)'''

# Luật 3 — khoá / token / bí mật sau dấu ":" hoặc "=": "Khoá API: `...`", "token = ...".
# "khoá" tiếng Việt còn nghĩa là "lock" (loại cổng) và "key" (định danh) ⇒ chỉ bắt khi có dấu ":"/"=", và bỏ qua giá trị dạng
# slug chữ thường-gạch nối (`m01-ho-so`). Đo trên handbook 26/10/2026: bản đầu (bắt "khoá … `x`" không cần dấu ":") báo nhầm 12 chỗ.
[[rules]]
id = "vi-key-colon"
description = "Khoá/token/bí mật sau nhãn tiếng Việt/Anh và dấu : hoặc ="
regex = '''(?i)(khoá|khóa|\bkhoa\b|bí\s?mật|\bbi\s?mat\b|\btoken\b)[^:=\n`|.;,]{0,20}[:=]\s*[*]{0,2}\s*`?([A-Za-z0-9!@#$%^&*_+=.\-]{8,})'''
secretGroup = 2
entropy = 3.0
keywords = ["khoá", "khóa", "khoa", "bí mật", "bi mat", "token"]
# Chỉ quét TÀI LIỆU + cấu hình chữ (anh Châu quyết 31/10/2026, chat, phương án 1a): trong MÃ NGUỒN mẫu "token: x" / "password: x"
# là tên biến, khoá quyền, nhãn giao diện. Đo 31/10 trên 5 repo: vi-key-colon 738/1047 phát hiện, gần như toàn báo nhầm trong .ts/.rs/.mjs.
# Bí mật trong mã nguồn do luật mặc định của gitleaks bắt (generic-api-key, curl-auth-…).
path = '''(?i)(\.(md|markdown|mdx|txt|ya?ml|toml|ini|cfg|conf|properties|adoc|rst)$|(^|/)[^/.]+$)'''

[[rules.allowlists]]
description = "Định danh dạng slug (khoá kịch bản, mã dự án) — không phải bí mật"
regexTarget = "secret"
regexes = ['''^[a-z0-9]+(-[a-z0-9]+)*$''']

# Chỗ giữ chỗ / tên biến / tên thuật toán — không phải bí mật (áp cho cả ba luật tiếng Việt).
# ⚠️ gitleaks GỘP các mẫu trong một allowlist thành MỘT biểu thức bằng "|": cờ "(?i)" đặt đầu một mẫu sẽ LAN sang mọi mẫu sau
# (đo 10/11/2026: `^[A-Z][A-Z0-9_]{3,}$` thành không phân biệt hoa thường ⇒ mật khẩu chỉ chữ+số như matkhau: Abc9... LỌT).
# ⇒ chỉ dùng cờ có phạm vi "(?i:...)", không bao giờ "(?i)" trần trong allowlist.
[[allowlists]]
description = "Tên thuật toán, tên biến môi trường, chỗ giữ chỗ trong tài liệu"
targetRules = ["vi-password-backtick", "vi-password-colon", "vi-key-colon"]
regexTarget = "secret"
regexes = [
  '''^(?i:argon2(id)?|bcrypt|scrypt|pbkdf2|sha(256|512)|hmac.*)$''',
  # Tên biến môi trường, kể cả dạng gán `TEN_BIEN=` và dạng họ biến `TIEN_TO_*` (EH-AMS M13: `FIELD_SESSION_*`, `DISPLAY_NAME=`).
  '''^[A-Z][A-Z0-9_]{3,}(=|_\*)?$''',
  '''(?i:thay[-_]?bang|placeholder|example|changeme|your[-_]|xxx+|\*{3,}|\.{3,}|<[^>]+>)''',
  '''^\$\{?[A-Za-z_]''',
  # ── Bổ sung 10/11/2026 (anh Châu quyết, chat): bỏ BẮT NHẦM đã xác minh ở EHB-SM + EH-AMS (16/33 lượt CI đỏ EHB-SM, ~25/27 EH-AMS).
  # Mỗi mẫu chỉ nhận HÌNH DẠNG không thể là mật khẩu thật: chỉ chữ (không số, không ký hiệu) theo cú pháp định danh trong mã/tệp.
  # Tên trong mã dạng Lớp.thuộc_tính — chỉ chữ và "_" quanh dấu chấm: `Role.fieldLogin`, `AuthMethod.PASSWORD`, `app_user.status`, `khong.co.ai`.
  '''^[A-Za-z_]+(\.[A-Za-z_]+)+$''',
  # Tên biến/trường/kiểu camelCase, PascalCase, snake_case CHỈ CHỮ: `temporaryPassword`, `browserFlow`, `LoginChallenge`, `email_domain`.
  # (Trước 10/11 các tên này "lọt" nhờ lỗi cờ (?i) lan — xem cảnh báo ở trên; nay ghi rõ, và có chữ số là bị bắt.)
  '''^[A-Za-z][a-z]+([A-Z][a-z]+)+$''',
  '''^[a-z]+(_[a-z]+)+$''',
  # Tên tệp cấu hình/mã: `staging.env`, `compose.staging.yml`, `S1-spec.md` — đuôi tệp đã biết.
  '''^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*\.(?i:env|ya?ml|json|toml|ini|conf|md|txt|sh|ts|js|mjs|rs|sql|html)$''',
  # Địa chỉ/đầu hộp thư chữ thường (`hoadon@`, `ke.toan@ehbean.org`) — địa chỉ, không phải mật khẩu.
  '''^[a-z][a-z0-9._-]*@(([a-z0-9-]+\.)+[a-z]{2,})?$''',
  # Câu chỉ CHỖ CẤT bí mật: "Tệp khoá tài khoản dịch vụ: **Bitwarden**" (EHB-SM S1).
  '''^\**(?i:bitwarden|vaultwarden)\**$''',
]

# Tên luồng/vai/định danh dạng slug HAI từ chỉ chữ (`eh-browser`, ADR-015 EHB-SM) ở hai luật mật khẩu.
# Cố ý hẹp hơn luật khoá (slug mọi độ dài): cụm 3+ từ hoặc có chữ số vẫn bị bắt vì có thể là mật khẩu dạng cụm từ.
[[allowlists]]
description = "Định danh slug hai từ chỉ chữ cạnh chữ 'mật khẩu' — tên luồng/vai, không phải mật khẩu"
targetRules = ["vi-password-backtick", "vi-password-colon"]
regexTarget = "secret"
regexes = ['''^[a-z]{2,}-[a-z]{2,}$''']

# curl --user lấy tài khoản từ BIẾN MÔI TRƯỜNG viết kiểu docker compose (`$$TEN:$$TEN` — `$$` là thoát của `$`).
# Luật mặc định curl-auth-user của gitleaks đã bỏ qua `$TEN:$TEN` nhưng không hiểu `$$` ⇒ EH-AMS docker-compose.deploy.yml đỏ
# mỗi lần tệp dời dòng (vân tay .gitleaksignore theo số dòng: 186→209→211→271→282). Chỉ nhận khi CẢ HAI vế đều là tên biến.
[[allowlists]]
description = "curl --user \"$$BIEN:$$BIEN\" (docker compose) — hai tên biến, không có giá trị"
targetRules = ["curl-auth-user"]
regexTarget = "secret"
regexes = ['''^["']?\$\$?\{?[\p{L}_][\p{L}\p{N}_]*\}?:\$\$?\{?[\p{L}_][\p{L}\p{N}_]*\}?["']?$''']

# Bài kiểm tự động: mật khẩu/AUTH_SECRET GIẢ cho database thử dựng tạm (EH-AMS *.int.spec.ts, 11 chỗ trên main 10/11/2026).
# Cần CẢ HAI: tệp kiểm (.spec./.test./tests/) VÀ giá trị theo quy ước đặt tên giả `int-test-…`, `test-…`, `fake-…`, `dummy-…`,
# `gia-…`, `mat-khau-…` (chữ thường, số, gạch nối). Chuỗi ngẫu nhiên trong tệp kiểm vẫn bị bắt.
[[allowlists]]
description = "Giá trị GIẢ theo quy ước đặt tên trong tệp kiểm tự động"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?i:\.(spec|test)\.[cm]?[jt]sx?$|(^|/)tests?/)''']
regexes = ['''^(int-test|test|fake|dummy|gia|mat-khau)-[a-z0-9-]+$''']

# Chuỗi kết nối database KHÔNG có tài khoản: `KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak` (EHB-SM compose.staging.yml,
# 10 lượt đỏ 05–06/11 — "keycloak" chứa chữ "key"). Chỉ nhận khi cả dòng là khoá: URL gồm máy:cổng/tên — không "@", không "?".
[[allowlists]]
description = "URL database không có tài khoản/mật khẩu (chỉ máy, cổng, tên database)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_.-]+\s*[:=]\s*["']?(jdbc:)?[a-z][a-z0-9+]*://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9_.-]*)?["']?\s*$''']

# Khuôn PEM trong mã: thân khoá là CHỖ ĐIỀN của lệnh định dạng ("-----BEGIN PRIVATE KEY-----\n{}\n-----END…", %s, ${…}) —
# khoá sinh lúc chạy, không có khoá trong tệp (EHB-SM crates/adapters/tests/gmail_service_account.rs, PR #103). Thân base64 thật vẫn bị bắt.
[[allowlists]]
description = "Khuôn PEM có chỗ điền định dạng thay cho thân khoá"
targetRules = ["private-key"]
regexTarget = "match"
regexes = ['''^-----BEGIN[ A-Z0-9_-]*PRIVATE KEY(?: BLOCK)?-----(?:\\n|\s)*(?:\{\}|\{[0-9]+\}|%s|\$\{)''']

# Đường dẫn bỏ qua. Mọi đường dẫn ở đây dựa trên giả định "nằm ngoài git" hoặc "là fixture cố ý";
# cổng secret-scan tự khẳng định .env không bị git theo dõi (allowlist không có phép khẳng định là điểm mù — án lệ nội bộ).
[[allowlists]]
description = "Fixture cổng quét bí mật (khoá GIẢ cố ý) + thư mục build/cache + .env ngoài git"
paths = [
  '''(^|/)scripts/(gates/)?fixtures/(secret-scan|gitleaks)/''',
  '''(^|/)\.env(\.[A-Za-z0-9_-]+)?$''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)dist/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock)$''',
]
